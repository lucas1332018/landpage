<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid slice">
  <!-- Fundo: bancada escura com leve luz dourada -->
  <defs>
    <radialGradient id="luz" cx="68%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1A1406"/>
      <stop offset="45%" stop-color="#0C0903"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15110A"/>
      <stop offset="100%" stop-color="#060503"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="810" fill="url(#luz)"/>

  <!-- Trilhas da placa (ouro) -->
  <g stroke="#F2B705" stroke-width="2" fill="none" opacity="0.30" stroke-linecap="round">
    <path d="M0 120 H340 l40 40 H620 l30 -30 H870"/>
    <path d="M0 180 H300 l60 60 H560 l40 40 v120"/>
    <path d="M0 700 H260 l50 -50 H540 l30 30 H820 l40 -40 v-90"/>
    <path d="M120 810 V640 l40 -40 H380 l30 -30 V440"/>
    <path d="M1440 90 H1180 l-50 50 H940 l-30 30 v110"/>
    <path d="M1440 740 H1230 l-60 -60 H1000 l-40 -40 v-80"/>
    <path d="M1320 810 V690 l-40 -40 h-150"/>
    <path d="M700 810 V720 l50 -50 h130"/>
    <path d="M980 0 v110 l-40 40 h-140 l-30 30 v80"/>
    <path d="M1200 0 v70 l60 60 h180"/>
    <path d="M430 0 v90 l-30 30 H230 l-40 40 v120"/>
    <path d="M560 0 v60 l40 40 h160"/>
  </g>

  <!-- Trilhas secundárias, mais finas e discretas -->
  <g stroke="#C9971A" stroke-width="1.2" fill="none" opacity="0.18" stroke-linecap="round">
    <path d="M0 260 H220 l30 30 H480 l50 50 v100"/>
    <path d="M0 560 H180 l40 40 H420"/>
    <path d="M1440 220 H1260 l-40 40 H1060"/>
    <path d="M1440 420 H1300 l-70 70 v120"/>
    <path d="M860 810 V700 l-30 -30 H660 l-40 -40 V520"/>
    <path d="M300 0 v60 l-50 50 H90 l-40 40 v110"/>
    <path d="M1100 810 V730 l40 -40 h120"/>
    <path d="M760 0 v80 l30 30 v120"/>
  </g>

  <!-- Vias (pontos de solda) -->
  <g fill="#F2B705" opacity="0.45">
    <circle cx="340" cy="120" r="5"/>
    <circle cx="870" cy="130" r="5"/>
    <circle cx="300" cy="180" r="4"/>
    <circle cx="660" cy="400" r="5"/>
    <circle cx="260" cy="700" r="4"/>
    <circle cx="890" cy="640" r="5"/>
    <circle cx="410" cy="370" r="4"/>
    <circle cx="1180" cy="90" r="5"/>
    <circle cx="910" cy="290" r="4"/>
    <circle cx="1230" cy="740" r="5"/>
    <circle cx="1130" cy="650" r="4"/>
    <circle cx="880" cy="670" r="4"/>
    <circle cx="980" cy="110" r="4"/>
    <circle cx="1260" cy="130" r="4"/>
    <circle cx="430" cy="90" r="4"/>
    <circle cx="720" cy="100" r="4"/>
    <circle cx="190" cy="240" r="4"/>
    <circle cx="530" cy="440" r="4"/>
    <circle cx="120" cy="640" r="4"/>
    <circle cx="700" cy="720" r="4"/>
  </g>
  <!-- Anéis de via -->
  <g stroke="#F2B705" stroke-width="1.5" fill="none" opacity="0.35">
    <circle cx="560" cy="240" r="8"/>
    <circle cx="1060" cy="260" r="8"/>
    <circle cx="820" cy="730" r="8"/>
    <circle cx="230" cy="420" r="8"/>
    <circle cx="1360" cy="560" r="8"/>
    <circle cx="90" cy="150" r="8"/>
  </g>

  <!-- Processador central -->
  <g transform="translate(900,330)">
    <!-- pinos -->
    <g stroke="#F2B705" stroke-width="3" opacity="0.55" stroke-linecap="round">
      <path d="M30 -18 v-26 M70 -18 v-26 M110 -18 v-26 M150 -18 v-26 M190 -18 v-26"/>
      <path d="M30 238 v26 M70 238 v26 M110 238 v26 M150 238 v26 M190 238 v26"/>
      <path d="M-18 30 h-26 M-18 70 h-26 M-18 110 h-26 M-18 150 h-26 M-18 190 h-26"/>
      <path d="M238 30 h26 M238 70 h26 M238 110 h26 M238 150 h26 M238 190 h26"/>
    </g>
    <rect x="-12" y="-12" width="244" height="244" rx="14" fill="url(#chipGrad)" stroke="#F2B705" stroke-width="2.5" opacity="0.9"/>
    <rect x="34" y="34" width="152" height="152" rx="8" fill="none" stroke="#F2B705" stroke-width="1.5" opacity="0.5"/>
    <rect x="76" y="76" width="68" height="68" rx="4" fill="#F2B705" opacity="0.55"/>
    <!-- gravação no chip -->
    <text x="110" y="214" text-anchor="middle" font-family="monospace" font-size="15" fill="#F2B705" opacity="0.65" letter-spacing="3">INOVA</text>
  </g>

  <!-- Chave de fenda de precisão (manutenção) -->
  <g transform="translate(355,585) rotate(-35)" opacity="0.5">
    <rect x="0" y="-9" width="120" height="18" rx="9" fill="none" stroke="#F2B705" stroke-width="2"/>
    <path d="M18 -9 v18 M36 -9 v18" stroke="#F2B705" stroke-width="1.2" opacity="0.7"/>
    <rect x="120" y="-3.5" width="95" height="7" rx="3.5" fill="#F2B705" opacity="0.7"/>
    <path d="M215 -3.5 l16 2 v3 l-16 2 z" fill="#F2B705" opacity="0.85"/>
  </g>

  <!-- Ponta de ferro de solda com fio de estanho -->
  <g transform="translate(1210,565) rotate(24)" opacity="0.45">
    <rect x="0" y="-8" width="90" height="16" rx="8" fill="none" stroke="#F2B705" stroke-width="2"/>
    <path d="M90 -5 h40 l28 4 -28 4 h-40 z" fill="#F2B705" opacity="0.7"/>
    <circle cx="162" cy="3" r="3" fill="#FFD147"/>
  </g>
  <path d="M1105 690 q40 -28 76 -6 t70 -18" stroke="#C9971A" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Componentes menores: resistores e capacitores -->
  <g opacity="0.4">
    <g transform="translate(590,150)">
      <rect x="0" y="0" width="54" height="20" rx="4" fill="none" stroke="#F2B705" stroke-width="1.5"/>
      <path d="M-18 10 H0 M54 10 h18" stroke="#F2B705" stroke-width="1.5"/>
      <path d="M12 0 v20 M26 0 v20 M40 0 v20" stroke="#F2B705" stroke-width="1" opacity="0.6"/>
    </g>
    <g transform="translate(240,300)">
      <rect x="0" y="0" width="54" height="20" rx="4" fill="none" stroke="#F2B705" stroke-width="1.5"/>
      <path d="M-18 10 H0 M54 10 h18" stroke="#F2B705" stroke-width="1.5"/>
      <path d="M12 0 v20 M26 0 v20 M40 0 v20" stroke="#F2B705" stroke-width="1" opacity="0.6"/>
    </g>
    <g transform="translate(1090,160)">
      <circle cx="16" cy="16" r="16" fill="none" stroke="#F2B705" stroke-width="1.5"/>
      <path d="M16 6 v20 M10 12 h12" stroke="#F2B705" stroke-width="1.2"/>
    </g>
    <g transform="translate(150,470)">
      <circle cx="16" cy="16" r="16" fill="none" stroke="#F2B705" stroke-width="1.5"/>
      <path d="M16 6 v20 M10 12 h12" stroke="#F2B705" stroke-width="1.2"/>
    </g>
    <g transform="translate(640,620)">
      <rect x="0" y="0" width="44" height="26" rx="3" fill="none" stroke="#F2B705" stroke-width="1.5"/>
      <path d="M8 -8 v8 M22 -8 v8 M36 -8 v8 M8 26 v8 M22 26 v8 M36 26 v8" stroke="#F2B705" stroke-width="1.2"/>
    </g>
    <g transform="translate(1040,440)">
      <rect x="0" y="0" width="44" height="26" rx="3" fill="none" stroke="#F2B705" stroke-width="1.5"/>
      <path d="M8 -8 v8 M22 -8 v8 M36 -8 v8 M8 26 v8 M22 26 v8 M36 26 v8" stroke="#F2B705" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Parafusos de cantos (detalhe de manutenção) -->
  <g stroke="#C9971A" fill="none" stroke-width="1.5" opacity="0.35">
    <g transform="translate(60,750)"><circle r="11"/><path d="M-6 -6 l12 12 M-6 6 l12 -12"/></g>
    <g transform="translate(1385,60)"><circle r="11"/><path d="M-6 -6 l12 12 M-6 6 l12 -12"/></g>
    <g transform="translate(1390,760)"><circle r="11"/><path d="M-7 0 h14"/></g>
    <g transform="translate(55,60)"><circle r="11"/><path d="M-7 0 h14"/></g>
  </g>
</svg>
